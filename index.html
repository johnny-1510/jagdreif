<style>
@font-face{font-family:"Alegreya";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/alegreya-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Alegreya";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/alegreya-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Alegreya";font-style:italic;font-weight:500;font-display:swap;src:url(fonts/alegreya-latin-500-italic.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/alegreya-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/alegreya-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/alegreya-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/alegreya-sans-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"UnifrakturMaguntia";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/unifrakturmaguntia-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}

html,body{margin:0}

/* Layout: eine Handy-Spalte (max. 480px) mit fester Tab-Leiste unten; jeder Tab ist ein eigener Bildschirm. Bewusst nur dunkel: Thema „Ansitz“ aus der Jagdreif-CI. */
:root{
  --ground:#151A15; --surface:#1E251E; --raised:#283128; --line:#36423A;
  --ink:#ECEBE2; --muted:#A3AB9B; --loden:#4C5B3F; --loden-text:#A8B88E; --loden-tint:#2C3826; --loden-on:#F4F3EA;
  --messing:#CDA85C; --messing-on:#151A15; --signal:#E5793A; --richtig:#94C26F; --falsch:#E46A4F;
  --display:"Alegreya", Georgia, "Times New Roman", serif;
  --fraktur:"UnifrakturMaguntia", "Alegreya", Georgia, serif;
  --sans:"Alegreya Sans", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-s:6px; --r-m:10px; --r-l:18px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));position:relative}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--ground) 70%,transparent)}
.top svg{width:30px;height:30px;flex:none}
.word{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.01em;line-height:1}
.pill{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--messing);border:1px solid color-mix(in srgb,var(--messing) 45%,transparent);border-radius:999px;padding:4px 10px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.screen{padding:0 16px;display:grid;gap:16px;animation:in .35s ease}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.2;margin:0}
.eyebrow{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--muted)}
.data{font-family:var(--mono);font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--messing);color:var(--messing-on);font-weight:700;padding:13px 18px;border-radius:var(--r-m);text-align:center;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.full{width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:2px solid var(--messing);outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;white-space:nowrap;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--loden-tint);border-color:var(--loden-text);color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:9px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
/* Tab-Leiste */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--messing)}
/* Himmel */
.sky{position:relative;margin:0 -16px;height:min(62vh,440px);overflow:hidden;border-radius:0 0 28px 28px}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.sky .over{position:absolute;left:20px;right:20px;bottom:22px;display:grid;gap:4px;text-shadow:0 1px 12px rgba(0,0,0,.45)}
.state{font-family:var(--display);font-weight:600;font-size:40px;line-height:1}
.count{font-family:var(--mono);font-size:15px;color:#F3E6C4}
.times{font-family:var(--mono);font-size:12px;color:rgba(236,235,226,.8);display:flex;gap:14px;flex-wrap:wrap}
.twinkle{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
/* Kacheln Heute */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{all:unset;cursor:pointer;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;display:grid;gap:6px;align-content:start;min-height:132px;transition:transform .12s,border-color .2s}
.tile:active{transform:scale(.98)}
.tile:hover{border-color:var(--loden-text)}
.tile .big{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.ring{width:54px;height:54px}
.ring circle{fill:none;stroke-width:6}
/* Rad */
.wheel svg{width:100%;height:auto;display:block;touch-action:manipulation}
.wheel .arc{fill:none;stroke-linecap:round;cursor:pointer;transition:opacity .2s,stroke-width .2s}
.legend{display:grid;gap:6px}
.lg{all:unset;cursor:pointer;display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-m);border:1px solid transparent}
.lg[aria-pressed="true"]{border-color:var(--line);background:var(--raised)}
.lg .dot{width:10px;height:10px;border-radius:50%}
.lg .d{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
/* Wischkarten */
.deck{position:relative;height:420px;perspective:1200px;touch-action:pan-y}
.fc{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:grab;user-select:none}
.fc.dragging{transition:none;cursor:grabbing}
.fc.back{transform:scale(.94) translateY(14px);opacity:.6;pointer-events:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);padding:24px 22px;display:grid;align-content:space-between;background:linear-gradient(160deg,var(--raised),var(--surface))}
.face.a{transform:rotateY(180deg);background:linear-gradient(160deg,#2F3B2A,var(--loden-tint));border-color:var(--loden)}
.face .q{font-family:var(--display);font-weight:600;font-size:27px;line-height:1.2;text-wrap:balance}
.face .ans{font-size:19px;line-height:1.5}
.flipped .inner{transform:rotateY(180deg)}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.stamp{position:absolute;top:22px;font-family:var(--mono);font-weight:500;font-size:14px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border:2px solid;border-radius:8px;opacity:0;z-index:3}
.stamp.yes{right:20px;color:var(--richtig);transform:rotate(8deg)}
.stamp.no{left:20px;color:var(--falsch);transform:rotate(-8deg)}
.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.circ{all:unset;cursor:pointer;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-size:22px;justify-self:center}
.circ.no{color:var(--falsch)}.circ.yes{color:var(--richtig)}
.circ:active{transform:scale(.94)}
/* Trainer */
.shot{position:relative;border-radius:var(--r-l);overflow:hidden;background:#0d110d;aspect-ratio:4/3}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s}
.shot.hidden img{filter:blur(22px) brightness(.4)}
.timer{position:absolute;left:0;bottom:0;height:5px;background:var(--messing);width:100%;transform-origin:left}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{all:unset;cursor:pointer;box-sizing:border-box;padding:14px 12px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);text-align:center;font-weight:600;min-height:54px;display:grid;place-items:center;line-height:1.25}
.opt.right{border-color:var(--richtig);background:color-mix(in srgb,var(--richtig) 16%,var(--surface))}
.opt.wrong{border-color:var(--falsch);background:color-mix(in srgb,var(--falsch) 16%,var(--surface))}
.opt[disabled]{cursor:default}
.badge{display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid}
.badge.frei{color:var(--richtig)}.badge.zu{color:var(--falsch)}
.score{font-family:var(--display);font-size:56px;font-weight:600;color:var(--messing);line-height:1}
/* Quiz */
.qmedia{border-radius:var(--r-m);overflow:hidden;background:#0d110d}
.qmedia img{width:100%;max-height:260px;object-fit:contain;display:block}
.qmedia svg{width:100%;height:auto;display:block}
.qq{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.2;margin:0}
.qopts{display:grid;gap:8px}
.qopt{all:unset;cursor:pointer;box-sizing:border-box;display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--raised);line-height:1.35}
.qopt .k{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
.qopt.right{border-color:var(--richtig);background:color-mix(in srgb,var(--richtig) 14%,var(--raised))}
.qopt.wrong{border-color:var(--falsch);background:color-mix(in srgb,var(--falsch) 14%,var(--raised))}
.qopt.dim{opacity:.5}
.box{border-radius:var(--r-m);padding:12px 14px;font-size:15.5px;background:var(--raised)}
.box .lbl{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.box ul{margin:0;padding-left:18px;display:grid;gap:4px}
.ok{color:var(--richtig)}.no{color:var(--falsch)}
.stampline{display:flex;gap:6px 12px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
/* Formulare, Listen */
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.form input,.form select,.form textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-s);padding:10px;width:100%}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--messing);outline-offset:1px}
.entry{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
ol.ml{margin:0;padding-left:22px;display:grid;gap:6px}
/* Nachschlagen (übernommen) */
.ref{display:grid;gap:16px}
.ref section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:16px;display:grid;gap:10px;min-width:0}
.ref h2{font-family:var(--display);font-size:22px;margin:0;line-height:1.2}
.ref h3{font-family:var(--display);font-size:18px;margin:6px 0 0}
.ref p{margin:0}
.ref ul{margin:0;padding-left:18px;display:grid;gap:5px}
.ref .stand{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ref .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--messing)}
.ref a{color:var(--loden-text)}
.ref .new{border-color:var(--messing)}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{color:var(--ink);font-size:14px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;min-width:400px}
.tbl th,.tbl td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl td.d{font-family:var(--mono);font-size:13px;white-space:nowrap}
.tbl tr.grp td{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--messing);padding-top:14px}
.sync{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center;padding:8px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.bruch{display:inline-block;vertical-align:-3px}
.wide{grid-column:1/-1;min-height:0;grid-template-columns:auto 1fr;align-items:center;gap:16px}
.wide .big{font-size:48px}
.mission{border-left:3px solid var(--messing);padding:4px 0 4px 16px;display:grid;gap:6px}
.mission q{font-family:var(--display);font-style:italic;font-size:21px;line-height:1.3;quotes:"„" "“"}
.notiz{background:none;border:none;padding:0;border-top:1px solid var(--line);padding-top:16px}
.notiz .h2{font-style:italic}
.ledger{width:100%;border-collapse:collapse;font-size:15px}
.ledger th{font-family:var(--sans);font-weight:600;font-size:12.5px;color:var(--muted);text-align:left;border-bottom:2px solid var(--line);padding:6px 8px 6px 0}
.ledger td{border-bottom:1px solid var(--line);padding:9px 8px 9px 0;vertical-align:top}
.ledger td.when{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--muted)}
.ledger td.anb{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.35}
.ledger .str{color:var(--messing);font-style:normal;font-family:var(--sans);font-size:14px;font-weight:600}
/* Print-Layout: Linien statt Kartenkästen */
.card{background:none;border:none;border-top:1px solid var(--line);border-radius:0;padding:18px 0 6px}
.h{font-family:var(--fraktur);font-weight:400;font-size:44px;line-height:1;margin:8px 0 0;letter-spacing:.01em}
.fr{font-family:var(--fraktur)!important;font-weight:400!important}
.lede{margin:0;font-size:17.5px;line-height:1.55}
.dropcap::first-letter{font-family:var(--fraktur);float:left;font-size:64px;line-height:.82;padding:6px 10px 0 0;color:var(--messing)}
.register{display:grid;border-top:2px solid var(--ink)}
.reg{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:86px 1fr 20px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.reg .num{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;color:var(--messing);font-variant-numeric:tabular-nums}
.reg .num small{font-size:18px;color:var(--muted);font-weight:500}
.reg .txt{display:grid;gap:2px;min-width:0}.reg .txt .muted{font-size:15px}
.reg .arr{color:var(--muted);font-size:18px}
.reg:active{background:var(--surface)}
.shot{margin:0 -16px;border-radius:0}
.qmedia{margin:0 -16px;border-radius:0}
.notiz .h2{font-style:italic}

.sec{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--muted);margin:6px 0 6px}
.bar{height:4px;background:var(--raised);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--messing)}
.sgrow .txt{gap:5px}
.exams{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.exam{all:unset;cursor:pointer;box-sizing:border-box;padding:16px 10px 16px 0;display:grid;gap:6px;align-content:start;border-right:1px solid var(--line)}
.exam+.exam{padding-left:12px}.exam:last-child{border-right:none}
.exam .ex-t{font-size:24px;color:var(--messing);line-height:1}.exam .muted{font-size:13.5px;line-height:1.3}
.exam:active{background:var(--surface)}
.back{all:unset;cursor:pointer;color:var(--loden-text);font-weight:600;font-size:15px}
.oral{border-left:3px solid var(--messing);padding:6px 0 6px 16px;display:grid;gap:10px}
ol.steps{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.stp{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:26px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);width:100%;line-height:1.4}
.stp .cb{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:4px;display:grid;place-items:center;margin-top:2px}
.stp.on{color:var(--muted)}.stp.on .cb{border-color:var(--messing)}
/* Ansitz */
.az-wrap{display:grid;gap:0;margin:0 -16px}
.az-stage{position:relative;height:min(64vh,460px);overflow:hidden;background:#0b0f0b;transition:filter .2s}
.az-stage.small{height:220px;margin:0 -16px;border-radius:0}
.az-stage svg{position:absolute;inset:0;width:100%;height:100%}
.az-stage.flash{filter:brightness(1.8)}
.beast{cursor:pointer}
.beast.sel path,.beast.sel circle{filter:drop-shadow(0 0 3px rgba(205,168,92,.9))}
.walk .l1{animation:leg .42s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.walk .l2{animation:leg .42s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
@keyframes leg{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.az-hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.az-light{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.4)}.az-light i{display:block;height:100%;background:var(--messing);transform-origin:left}
.az-msg{position:absolute;left:16px;right:16px;top:38px;font-family:var(--display);font-style:italic;font-size:20px;color:#efe9d6;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.glas{padding:16px;display:grid;gap:12px;background:var(--surface);border-bottom:1px solid var(--line)}
.glas-in{display:grid;gap:6px;border-left:3px solid var(--messing);padding-left:14px}
.btn.shoot{background:var(--signal);color:#1a0f08}
.az-intro{display:grid;gap:16px}
.az-cta{margin-top:10px;justify-self:start;padding:11px 18px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.tp{margin:0 -16px;background:linear-gradient(#2a3142,#6b5f7d 70%,#3a4632);}
.tp svg{width:100%;height:auto;display:block;cursor:crosshair;touch-action:manipulation}
.tp #organs{transition:opacity .5s}
.ask{border-top:2px solid var(--messing)}
.ask textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:10px;width:100%}
#gate{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 0%,#232c22,var(--ground));display:grid;place-items:center;padding:24px 16px;overflow:auto}
#gate .gbox{width:100%;max-width:380px;display:grid;gap:14px;text-align:center;justify-items:center}
#gate svg{width:84px;height:84px}
#gate h1{font-family:var(--display);font-size:38px;margin:0;letter-spacing:.01em}
#gate p{margin:0;color:var(--muted)}
#gate form{display:grid;gap:10px;width:100%}
#gate input{font:inherit;font-size:17px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-m);padding:13px 14px;width:100%;box-sizing:border-box}
#gate input:focus{outline:2px solid var(--messing);outline-offset:1px}
#gate .gmsg{min-height:1.5em;color:var(--ink)}
#gate .gfoot{font-size:13px}#gate .gfoot a{color:inherit}
.acctbtn{all:unset;cursor:pointer;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--loden-tint);border:1px solid color-mix(in srgb,var(--messing) 55%,transparent);color:var(--messing);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.02em}
.acctbtn:hover{background:var(--raised)}.acctbtn:focus-visible{outline:2px solid var(--messing);outline-offset:2px}
.konto .kid{display:flex;gap:16px;align-items:center;padding-top:8px}
.konto .kav{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--loden-tint);border:1.5px solid var(--messing);color:var(--messing);font-family:var(--display);font-weight:700;font-size:24px}
.konto{grid-template-columns:minmax(0,1fr)}.konto .kid>div{min-width:0}.konto .kid .h{font-size:clamp(28px,8vw,42px);overflow-wrap:anywhere}.konto .kid .muted{overflow-wrap:anywhere}
.konto .kicker{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--messing)}
.konto .kbox{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.konto .krow{display:flex;gap:8px}.konto .krow input{flex:1;min-width:0;width:0;font:inherit;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:var(--r-m);padding:11px 12px}
.glink{all:unset;cursor:pointer;justify-self:center;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px}
#gate .pw{position:relative}#gate .pw input{padding-right:84px}
#gate .eye{all:unset;cursor:pointer;position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);padding:6px}
#gate input.ro{opacity:.7}
#gate .glink{color:var(--muted)}
#gate .gsep{margin:0;border-top:1px solid var(--line);padding-top:14px;width:100%}#gate .glink.inl{color:var(--messing);padding:0 2px;font-weight:600}
.az-stage.three{height:clamp(320px,calc(100svh - 360px),600px);background:#10140f}
.az-stage canvas.az3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.az-stage.three .az-hud,.az-stage.three .az-msg,.az-stage.three .az-light{pointer-events:none;z-index:3}
.az-tools{position:absolute;right:12px;bottom:18px;display:flex;gap:8px;z-index:4}
.az-tool{all:unset;cursor:pointer;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(14,18,14,.62);border:1px solid rgba(205,168,92,.55);color:#e9e3cf;backdrop-filter:blur(4px)}
.az-tool[aria-pressed="true"]{background:var(--messing);color:var(--messing-on)}
.az-hint{position:absolute;left:12px;bottom:24px;right:120px;z-index:3;font-size:13px;color:#e9e3cf;text-shadow:0 1px 6px #000;transition:opacity .8s;pointer-events:none}
.glasov{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.glasov i{position:absolute;left:50%;top:50%;width:min(86%,78vh);aspect-ratio:1.55;transform:translate(-50%,-50%);border-radius:50% / 62%;box-shadow:0 0 0 200vmax rgba(5,7,5,.96),inset 0 0 30px 10px rgba(5,7,5,.85)}
.ringwrap{position:relative;flex:none;width:96px;height:96px}.ringnum{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px;color:var(--ink)}.ringnum small{font-size:14px;color:var(--muted)}
.reifelist{display:grid;border-top:1px solid var(--line)}
.rf{border-bottom:1px solid var(--line)}.rf summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:22px 112px 1fr 44px;gap:10px;align-items:center;padding:10px 0}.rf summary::-webkit-details-marker{display:none}
.rfn{font-family:var(--display);font-weight:700;color:var(--messing)}.rft{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rfp{font-family:var(--mono);font-size:13px;text-align:right}
.rfd{display:grid;gap:8px;padding:0 0 12px 32px}.rfd ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}.tagf{font-family:var(--mono);font-size:11px;color:var(--falsch);white-space:nowrap}
.hello{display:grid;gap:6px;padding-top:4px}.hello-h{font-size:clamp(30px,8vw,44px);margin:0}
.hchips{display:flex;flex-wrap:wrap;gap:8px}.hchip{all:unset;cursor:pointer;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.hchip.done{border-color:color-mix(in srgb,var(--richtig) 50%,transparent);color:var(--richtig)}.hchip:hover{border-color:var(--messing)}
.darf{border-left:4px solid var(--line)}.darf.frei{border-left-color:var(--richtig)}.darf.zu{border-left-color:var(--falsch)}
.darfbig{font-family:var(--display);font-weight:700;font-size:42px;line-height:1.05}.darf.frei .darfbig{color:var(--richtig)}.darf.zu .darfbig{color:var(--falsch)}
.wxnow{display:flex;gap:14px;align-items:center}.wxdir{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--messing);flex:none}
.wxstrip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;text-align:center;color:var(--loden-text)}.wxstrip div{display:grid;gap:2px;justify-items:center}
.map{height:min(62vh,520px);width:100%;background:#1b211a;position:relative;z-index:0;isolation:isolate}.leaflet-container{font:inherit;background:#1b211a}
.poi{background:none;border:none}.pin{width:28px;height:28px;border-radius:50%;background:var(--c);border:2px solid #151a15;box-shadow:0 2px 8px rgba(0,0,0,.5);display:grid;place-items:center}.pin.kirrung,.pin.wechsel,.pin.salz{width:18px;height:18px;margin:5px;border-radius:4px;transform:rotate(45deg)}
.pinl{position:absolute;left:34px;top:5px;white-space:nowrap;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.mapwind{background:rgba(21,26,21,.85);color:#e9e3cf;border-radius:10px;padding:6px 10px;display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:13px;border:1px solid rgba(205,168,92,.5)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1e251e;color:#ecebe2}.leaflet-popup-content{font-size:14px;line-height:1.4}.lnk{all:unset;cursor:pointer;color:var(--messing);text-decoration:underline;margin-top:6px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats>div{display:grid;gap:2px}.mbars{width:100%;height:auto}.mbars text{font-size:8px;fill:var(--muted);font-family:var(--mono)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.badge2{display:grid;gap:2px;padding:10px;border:1px solid var(--line);border-radius:10px;opacity:.45}.badge2.on{opacity:1;border-color:color-mix(in srgb,var(--messing) 55%,transparent)}.badge2 b{font-size:14px}.badge2 span{font-size:12px;color:var(--muted)}
.wb{border-top:1px solid var(--line)}.wb summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 0;font-weight:600}.wb summary::-webkit-details-marker{display:none}.wbd{padding:0 0 12px 32px;font-size:15.5px}.wbd ol{margin:6px 0 0;padding-left:18px;display:grid;gap:6px}
canvas.az3d.thermal{filter:grayscale(1) contrast(1.6) brightness(1.5)}
.az-mode{display:inline-block;margin-left:10px;font-family:var(--mono);font-style:normal;font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(233,227,207,.4);vertical-align:middle}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr)}.rf summary{grid-template-columns:22px 78px 1fr 40px}}
.mcqq{font-size:clamp(21px,5.4vw,26px);line-height:1.25}
.mcopts{display:grid;gap:10px}.mco{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--raised);font-size:16px;line-height:1.35;transition:border-color .15s,background .15s}
.mco:hover:not(:disabled){border-color:var(--messing)}.mco:focus-visible{outline:2px solid var(--messing);outline-offset:2px}
.mcl{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--muted)}
.mco.right{border-color:var(--richtig);background:color-mix(in srgb,var(--richtig) 14%,var(--raised))}.mco.right .mcl{background:var(--richtig);color:#151a15;border-color:var(--richtig)}
.mco.wrong{border-color:var(--falsch);background:color-mix(in srgb,var(--falsch) 14%,var(--raised))}.mco.wrong .mcl{background:var(--falsch);color:#151a15;border-color:var(--falsch)}
.mco:disabled{cursor:default}.mco:disabled:not(.right):not(.wrong){opacity:.55}

}

}

<section id="neu" class="new">
<span class="tag">Stand: Jagdjahr 2026/27</span>
<h2>Neu seit 1. April 2026</h2>
<p>Der Landtag hat die Reform des Bayerischen Jagdgesetzes am 19. März 2026 beschlossen. Sie gilt seit 1. April 2026. Bayern legt seine Jagdzeiten seitdem unabhängig vom Bund fest.</p>
<ul>
<li><b>Rehwild ohne Abschussplan möglich.</b> Die Jagdgenossenschaft oder der Eigenjagdbesitzer beschließt das und zeigt es der unteren Jagdbehörde nur an, eine Genehmigung braucht es nicht. Bedingungen: ein jährlicher Waldbegang mit Jagdgenossen und Pächter sowie eine Einigung, wie die Strecke nachgewiesen wird. In „roten“ Revieren kommt ein Jagdkonzept gegen Verbiss dazu. Ein- und Ausstieg ist jeweils vor dem 1. April möglich. Hält sich ein Revier nicht daran, setzt die Behörde wieder einen Plan fest.</li>
<li><b>Bockjagd ab 16. April</b> statt 1. Mai. Schmalrehe ebenfalls ab 16. April.</li>
<li><b>Wolf und Goldschakal</b> sind ins bayerische Jagdrecht aufgenommen, haben aber keine Jagdzeit. Auf Bundesebene steht der Wolf seit 2. April 2026 im Bundesjagdgesetz. Eine Jagdzeit (1. Juli bis 31. Oktober) gibt es dort nur mit einem behördlichen Managementplan. Bayern hat keinen.</li>
<li><b>Neue oder geänderte Jagdzeiten:</b> Grau- und Kanadagans 1. August bis 28. Februar (sitzende Junggänse zusätzlich im Juli), Steinmarder ab 1. August (Jungtiere ab 1. Juni), Dachs ab 1. August (Jungtiere ab 16. April), Sonderregel für Ringeltaubentrupps auf Äckern und Neueinsaaten.</li>
<li><b>Kitzrettung:</b> Das Absuchen von Mähflächen mit Drohne, das Einfangen und das Nottöten schwer verletzter Tiere sind jetzt rechtlich abgesichert. Ohne Jäger darf nur gehandelt werden, wenn er nicht erreichbar ist, und er ist danach zu informieren.</li>
<li><b>Nutria:</b> Fallenjagd und Nachtjagd sind zugelassen.</li>
<li><b>Schalldämpfer:</b> Das landesrechtliche Verbot ist gestrichen. Waffenrechtlich dürfen Jäger Schalldämpfer ohnehin seit 2020 nutzen.</li>
<li><b>Fallenjagd:</b> Die Sachkunde wird künftig über die bayerische Jägerprüfung nachgewiesen.</li>
<li><b>Freiflächen-PV</b> wird nicht mehr automatisch befriedet und bleibt Jagdfläche.</li>
</ul>
</section>

<section id="zeiten">
<h2>Jagdzeiten Bayern</h2>
<p class="stand">§ 19 AVBayJG, gültig ab 1. April 2026. Ohne Gewähr: Vor dem Schuss im Zweifel den Originaltext auf gesetze-bayern.de prüfen.</p>
<p>Elterntierschutz gilt immer: Für die Aufzucht notwendige Elterntiere dürfen in der Setz- und Brutzeit nicht bejagt werden, auch bei ganzjähriger Jagdzeit (§ 22 Abs. 4 BJagdG).</p>

<section id="technik">
<h2>Waffe, Munition, Technik</h2>
<h3>Munition (§ 19 BJagdG)</h3>
<ul>
<li>Rehwild: Büchsenpatrone mit mindestens 1.000 J auf 100 m (E100).</li>
<li>Übriges Schalenwild: mindestens 2.000 J (E100) und mindestens 6,5 mm Kaliber.</li>
<li>Schrot, Posten, Pfeile und Bolzen sind auf Schalenwild verboten. Flintenlaufgeschosse sind erlaubt.</li>
<li>Fangschuss mit der Kurzwaffe: Mündungsenergie mindestens 200 J.</li>
</ul>
<h3>Blei</h3>
<ul>
<li>Bleischrot ist in und an Feuchtgebieten EU-weit seit Februar 2023 verboten, inklusive 100 m Pufferzone. Das gilt auch, wenn nur Feuchtgebiet überschossen wird.</li>
<li>Ein flächendeckendes Bleischrotverbot hat die EU 2026 beschlossen, mit sieben Jahren Übergangsfrist. Bleihaltige Büchsen- und Kurzwaffenmunition ist nach dem beschlossenen Stand nicht betroffen.</li>
<li>Viele Veranstalter, darunter die Bayerischen Staatsforsten, verlangen schon jetzt bleifreie Büchsenmunition.</li>
</ul>
<h3>Nachtsicht und Wärmebild</h3>
<ul>
<li>Seit 17. Mai 2024 erlaubt § 11a AVBayJG in ganz Bayern Nachtsicht-Vorsätze und -Aufsätze, IR-Strahler und Lampen auf <b>Schwarzwild, Haarraubwild und Nutria</b>.</li>
<li>Auf alles andere Wild, etwa Rehwild, bleiben sie verboten.</li>
<li>Nachtzielgeräte mit integriertem Absehen bleiben für alle Wildarten verboten.</li>
<li>Besitz von Vorsätzen und Aufsätzen ist Jagdscheininhabern waffenrechtlich erlaubt (§ 40 Abs. 3 WaffG).</li>
<li>Nachtjagd: Schwarzwild und Raubwild dürfen auch nachts bejagt werden, seit 2026 auch Nutria.</li>
</ul>
<h3>Führen und Transport</h3>
<ul>
<li>Zur Jagd, zum Jagdschutz, zum Einschießen und auf dem Weg dorthin darfst du Jagdwaffen ohne Waffenschein führen. Auf dem Weg nicht schussbereit, also ohne Patrone im Lager und Magazin (§ 13 Abs. 6 WaffG).</li>
<li>Das Auto ist kein Aufbewahrungsort. Die Waffe darf nicht unbeaufsichtigt im Fahrzeug bleiben, auch nicht kurz beim Einkaufen.</li>
<li>Schalldämpfer: Jäger dürfen sie für Langwaffen mit Büchsenpatronen erwerben. Der Eintrag erfolgt in die WBK.</li>
</ul>
<h3>Aufbewahrung (§ 13 AWaffV)</h3>
<ul>
<li>Erlaubnispflichtige Lang- und Kurzwaffen gehören in ein Behältnis mit mindestens Widerstandsgrad 0 nach EN 1143-1. Dein Schrank hat Grad I.</li>
<li>Munition kommt in ein Stahlblechbehältnis oder ins Innenfach des Waffenschranks.</li>
<li>Die Behörde darf die Aufbewahrung verdachtsunabhängig kontrollieren. Schlüssel oder Code darf kein Unberechtigter haben, auch nicht der Partner.</li>
</ul>
</section>

<section id="schuss">
<h2>Schuss, Pirschzeichen, Nachsuche</h2>
<p>Die Wartezeiten sind Faustregeln. Im Zweifel länger warten und das Nachsuchengespann früh anrufen.</p>
<div class="tbl"><table>
<thead><tr><th>Pirschzeichen</th><th>Wahrscheinlicher Sitz</th><th>Vorgehen</th></tr></thead>
<tbody>
<tr><td>Hellroter, schaumig-blasiger Schweiß, rosa Lungenstücke</td><td>Lunge</td><td>Kurz warten, dann der Rotfährte folgen. Liegt meist nach kurzer Flucht.</td></tr>
<tr><td>Stück schlägt hinten hoch, flüchtet hochflüchtig, viel Schweiß</td><td>Kammer, Herz</td><td>Kurz warten. Meist verendet nach 30–100 m.</td></tr>
<tr><td>Dunkelroter, fast bräunlicher Schweiß, Leberstückchen</td><td>Leber</td><td>Etwa 2 Stunden warten, dann mit Hund.</td></tr>
<tr><td>Wenig Schweiß, grünliche Panseninhalte, Stück krümmt sich und zieht langsam ab</td><td>Weidwund</td><td>3–4 Stunden warten, dann Schweißhund. Nicht selbst drücken.</td></tr>
<tr><td>Knochensplitter, Stück knickt vorn oder hinten ein</td><td>Lauf</td><td>Sofort Nachsuchengespann. Laufkranke Stücke brauchen oft eine Hetze.</td></tr>
<tr><td>Stück bricht im Feuer zusammen, schlegelt, wird wieder hoch</td><td>Krellschuss (Dornfortsatz)</td><td>Repetieren, im Anschlag bleiben, nachschießen.</td></tr>
<tr><td>Viel Schnitthaar, wenig Schweiß, Muskelfasern</td><td>Wildbret, Streifschuss</td><td>Nachsuche mit Hund, oft schwierig.</td></tr>
</tbody></table></div>
<h3>Am Anschuss</h3>
<ul>
<li>Vor dem Hingehen: Standort, Anschuss und Fluchtrichtung merken, Uhrzeit notieren.</li>
<li>Anschuss verbrechen (Bruch oder Band), nicht zertrampeln, keine Pirschzeichen einsammeln.</li>
<li>Jeder Schuss wird kontrolliert, auch wenn du sicher bist, dass du vorbeigeschossen hast (§ 22a BJagdG).</li>
<li>Die Nummer einer anerkannten Nachsuchenstation gehört vor dem ersten Ansitz ins Handy.</li>
</ul>
<h3>Wildfolge</h3>
<ul>
<li>Wechselt krankes Wild ins Nachbarrevier, gilt die schriftliche Wildfolgevereinbarung. Ohne sie: Grenze nicht mit der Waffe überschreiten, Übertritt markieren und den Nachbarn sofort informieren.</li>
<li>Für bestätigte Nachsuchengespanne gelten in Bayern erleichterte Regeln für die Wildfolge.</li>
</ul>
<h3>Treffpunkt</h3>
<ul>
<li>Breit stehendes Schalenwild: auf das Blatt, senkrecht über dem Vorderlauf im unteren Drittel des Rumpfs.</li>
<li>Immer mit Kugelfang. Nie auf Wild schießen, das auf einer Kuppe gegen den Himmel steht, und nie auf Wasser, Fels oder gefrorenen Boden.</li>
<li>Bei schräg oder spitz stehendem Wild den Ausschuss mitdenken. Lieber warten, bis das Stück breit steht.</li>
</ul>
</section>

<section id="ansprechen">
<h2>Ansprechen</h2>
<h3>Rehwild</h3>
<ul>
<li>Spiegel im Winter: Bock nierenförmig mit Pinsel vorn, Geiß umgekehrt herzförmig mit Schürze.</li>
<li>Gehörn: Abwurf Oktober bis Dezember, Schieben im Bast über den Winter, Fegen März bis Mai. Junge Böcke fegen später.</li>
<li>Jährling: schlanker Träger, wirkt hochläufig und „kindlich“, oft Spießer oder Knopfbock, verfärbt im Frühjahr später.</li>
<li>Älterer Bock: dicker, kurzer Träger, tiefer, massiger Rumpf, Haupt wirkt grau, oft trägt er es tiefer. Er verfärbt früh.</li>
<li>Kitz und Geiß im Herbst: Das Kitz hat ein kurzes Gesicht und einen kleinen Rumpf. Bei der Drückjagd gilt Kitz vor Geiß.</li>
</ul>
<h3>Schwarzwild</h3>
<ul>
<li>Frischling: bis 31. März des Folgejahres. Streifen bis etwa 4 Monate.</li>
<li>Überläufer: zweites Lebensjahr.</li>
<li>Bache: weiblich, ab dem dritten Jahr. Keiler: männlich, mit Pinsel und sichtbaren Waffen.</li>
<li>Führende Bache erkennst du am deutlichen Gesäuge und an Frischlingen in der Nähe. Die stärkste Sau einer Rotte ist meist die Leitbache, und die ist tabu.</li>
<li>Keiler stehen meist allein. Der Pinsel am Bauch ist das sicherste Zeichen.</li>
</ul>
<h3>Gams und Rotwild</h3>
<ul>
<li>Gamsbock: kräftigere, enger und stärker gehakelte Krucken, Pinsel. Geiß: dünnere, weiter gestellte Krucken, oft mit Kitz.</li>
<li>Rotwild: Kalb, Schmaltier und Alttier am Körperbau unterscheiden. Das Kalb hat ein kurzes Haupt und einen „Kindchenkopf“. Kalb vor Alttier.</li>
</ul>
<h3>Raubwild und Federwild</h3>
<ul>
<li>Steinmarder: weißer, gegabelter Kehlfleck, helle Nase. Baummarder: dottergelber, ungegabelter Kehlfleck, dunkle Nase.</li>
<li>Hermelin: schwarze Schwanzspitze, auch im weißen Winterkleid.</li>
<li>Ringeltaube: weiße Flügelbinde und weißer Halsfleck. Hohltaube: beides fehlt, und sie ist geschont.</li>
<li>Rabenkrähe: gerade abgeschnittener Stoß. Kolkrabe: Keilstoß, Kehlbart, Jagdrecht mit ganzjähriger Schonzeit.</li>
<li>Greifvögel: alle ganzjährig geschont.</li>
</ul>
</section>

<section id="kalender">
<h2>Wildkalender</h2>

<thead><tr><th>Wildart</th><th>Brunft, Ranz, Rausche</th><th>Setz- und Brutzeit</th></tr></thead>

</tbody></table></div>
</section>

<section id="wildbret">
<h2>Wildbret</h2>
<ul>
<li>Unverzüglich aufbrechen, Bauchhöhle offen halten und im Schatten auskühlen lassen.</li>
<li>Kühlen: Schalenwild auf höchstens +7 °C, Kleinwild auf höchstens +4 °C. Nie luftdicht in Folie.</li>
<li>Trichinenuntersuchung ist Pflicht für Schwarzwild, Dachs und andere Fleisch- und Allesfresser, die verzehrt werden.</li>
<li>Mit bestandener Jägerprüfung bist du „kundige Person“ und begutachtest das Stück selbst. Auffälliges Verhalten vor dem Schuss, Abszesse, Organveränderungen oder Abmagerung bedeuten: kein Verkauf ohne amtliche Fleischuntersuchung.</li>
<li>Kleine Mengen darfst du direkt an Endverbraucher oder an örtliche Gastronomie und Einzelhändler abgeben. Mit dabei: Wildursprungsschein bzw. Wildmarke.</li>
<li>Bei Schwarzwild gilt ASP-Hygiene: Aufbruch und Schweiß nicht offen liegen lassen. Kleidung, Stiefel, Auto und Hund reinigen, besonders nach Jagden in ASP-Gebieten. Tot aufgefundene Sauen dem Veterinäramt melden.</li>
</ul>
</section>

<section id="revier">
<h2>Revierpraxis Bayern</h2>
<ul>
<li><b>Jagdjahr:</b> 1. April bis 31. März. Jagdscheine laufen zum 31. März ab. Deiner gilt bis 31.03.2029.</li>
<li><b>Jagdhaftpflicht</b> ist Pflicht für den Jagdschein (§ 17 BJagdG): mindestens 500.000 € für Personen- und 50.000 € für Sachschäden.</li>
<li><b>Forstliches Gutachten:</b> Die Verbissbelastung je Hegegemeinschaft oder Revier wird als tragbar („grün“) oder zu hoch („rot“) bewertet. Danach richtet sich der Rehwildabschuss. Neu ist das Modell ohne Abschussplan.</li>
<li><b>Streckenliste und Hegeschau</b> bleiben auch ohne Abschussplan.</li>
<li><b>Wildschaden:</b> beim Schwarzwild an Feld und Wiese. Bei der Gemeinde binnen einer Woche nach Kenntnis anmelden (§ 34 BJagdG). Ersatzpflichtig ist die Jagdgenossenschaft, meist laut Pachtvertrag auf den Pächter übertragen.</li>
<li><b>Kitzrettung:</b> Mähflächen vorher mit Drohne absuchen, in der Morgenkühle. Kitze nur mit Handschuhen und Grasbüscheln anfassen, im Schatten in einer Kiste sichern und nach der Mahd freilassen.</li>
<li><b>Wildunfall:</b> Unfallstelle sichern und 110 rufen. Erlösen nur mit Freigabe von Polizei oder Revierinhaber oder im echten Notstand (§ 34 StGB). Nie mitnehmen (§ 292 StGB).</li>
<li><b>Bewegungsjagd:</b> Waffe erst am Stand laden, nach dem Abblasen sofort entladen. Kein Schuss ins Treiben. Ansprechen geht vor Schnelligkeit. Viele Veranstalter verlangen einen jährlichen Schießnachweis.</li>
<li><b>Kirrung:</b> nur artgerechtes Kirrgut in kleinen Mengen, ausgebracht so, dass Rehwild nicht rankommt. Die Details regeln Landesrecht und Revier.</li>
</ul>
</section>

 w:["Führende Bache: deutliches Gesäuge, Frischlinge in der Nähe. Die stärkste Sau ist meist die Leitbache, und mit ihr bricht die Rotte auseinander.","Frischling: bis 31. März des Folgejahres, gestreift bis etwa vier Monate. Überläufer: zweites Lebensjahr.","Nachtsicht- und Wärmebildvorsätze sind auf Schwarzwild in Bayern erlaubt."],
 law:"§ 22 Abs. 4 BJagdG · § 19 AVBayJG",

{m:"Jun", tag:"schuss", stamp:["13. Juni","05:05","Anschuss am Waldrand","Nach Schuss auf Jährling"],

{m:"Jun", tag:"ansprechen", stamp:["20. Juni","21:05","Waldwiese","Rote Sommerdecke"],

 q:"Welches Merkmal spricht für den älteren Bock?",
 o:["Langer, dünner Träger und hochläufige Figur","Kurzer, dicker Träger, tiefer massiger Rumpf, graues Gesicht","Er ist besonders neugierig und unruhig","Er hat ein Gehörn mit sechs Enden"],
 a:1,
 x:"Ältere Böcke wirken gedrungen: dicker Träger, der nahtlos in den Rumpf übergeht, tiefe Brust, oft graues Gesicht, das Haupt eher tief getragen. Die Endenzahl sagt über das Alter wenig.",
 w:["Jährling: schlank, „kindliches“ Gesicht, oft Spießer oder Knopfbock, verfärbt im Frühjahr später.","Mittelalter Bock: kräftiger, aber noch mit schlanker Taille.","Alte Böcke sind vorsichtig und kommen oft erst spät aus dem Bestand.","Gehörnaufbau hängt stark von Äsung und Erbanlage ab, nicht vom Alter."],

{m:"Jul", tag:"recht", stamp:["6. Juli","05:30","Wildkamera am Wechsel","Nacht zuvor"],

 q:"Was gilt in Bayern?",
 o:["Seit 2026 Jagdzeit 1. Juli bis 31. Oktober, du darfst ihn erlegen","Er steht seit 2026 im Jagdrecht, hat in Bayern aber keine Jagdzeit. Entnahme nur per behördlicher Ausnahme","Er unterliegt nicht dem Jagdrecht","Nur der Revierinhaber darf ihn erlegen"],
 a:1,

 w:["Grund für die Änderung: Die EU hat den Wolf 2025 von „streng geschützt“ auf „geschützt“ herabgestuft.","Entnahmen sind weiter nur per Ausnahme der Behörde möglich, etwa zur Schadensabwehr bei Nutztierrissen.","Die Länder können nicht schützbare Weidegebiete wie Almen zur Bejagung bestimmen.","Sichtung oder Riss dem Landesamt für Umwelt melden."],
 law:"BayJG 2026 · § 22d BJagdG (seit 02.04.2026)",
 t:"Fotos mit Datum und Ort an das LfU-Wildtiermonitoring schicken. Hinweise aus der Jägerschaft sind dort sehr gefragt."},
{m:"Jul", tag:"ansprechen", stamp:["10. Juli","20:30","Feldrand am Bau","Abendsonne"],

{m:"Jul", tag:"schuss", stamp:["28. Juli","21:10","Wiesenrand","Blattzeit, schwül"],

function sunPos(d){
  const rad=Math.PI/180, n=d/864e5+2440587.5-2451545.0;
  const L=(280.460+0.9856474*n)%360, g=((357.528+0.9856003*n)%360)*rad;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad, eps=(23.439-0.0000004*n)*rad;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=(18.697374558+24.06570982441908*n)%24;
  const H=((gmst*15+LON)*rad-ra);
  const la=LAT*rad;
  const el=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H));
  let az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(la)-Math.tan(dec)*Math.cos(la))/rad+180;
  return {el:el/rad, az:(az+360)%360};
}
function dayTimes(){ // Übergänge per Minuten-Scan

}

function skyState(now){
  const t=dayTimes(), s=sunPos(now), mi=Math.round, diff=d=>d?(d-now)/6e4:0;
  const fmt=min=>min>=60?`${Math.floor(min/60)} h ${mi(min%60)} min`:`${mi(min)} min`;
  let state,count;
  if(t.dawn&&now<t.dawn){state="Nacht";count=`Morgendämmerung in ${fmt(diff(t.dawn))}`}
  else if(t.rise&&now<t.rise){state="Morgendämmerung";count=`Sonnenaufgang in ${fmt(diff(t.rise))}`}
  else if(t.set&&now<new Date(t.set-36e5)){state="Tag";count=`Sonnenuntergang in ${fmt(diff(t.set))}`}
  else if(t.set&&now<t.set){state="Abendansitz";count=`Sonnenuntergang in ${fmt(diff(t.set))}`}
  else if(t.dusk&&now<t.dusk){state="Abenddämmerung";count=`noch ${fmt(diff(t.dusk))} bürgerliche Dämmerung`}
  else {state="Nacht";count=`Mond: ${moonInfo(now).name}`}
  return {state,count,t,el:s.el};
}

  const others=TR.filter(x=>x.g!==it.g).map(x=>x.n).sort(()=>Math.random()-.5);
  const opts=[it.n,...[...new Set([...same,...others])].slice(0,3)].sort(()=>Math.random()-.5);
  $("#tz").innerHTML=`<section class="card" style="gap:14px"><div class="row" style="justify-content:space-between"><span class="eyebrow">Bild ${tr.i+1} von ${tr.pool.length}</span><span class="eyebrow" style="color:var(--messing)">${tr.score} Punkte${tr.combo>1?" · Serie ×2":""}</span></div>
   <div class="shot" id="shot"><img src="${IMG[it.img]}" alt="Wildtier zum Ansprechen"><div class="timer" id="tm"></div></div>
   <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><div id="tf"></div></section>`;
  const tm=$("#tm"), t0=performance.now(), DUR=5000; let done=false, raf;
  const tick=now=>{const p=Math.min(1,(now-t0)/DUR);tm.style.transform=`scaleX(${1-p})`;if(p>=1){answer(null)}else raf=requestAnimationFrame(tick)};
  raf=requestAnimationFrame(tick);
  function answer(o){if(done)return;done=true;cancelAnimationFrame(raf);
    const ok=o===it.n, left=Math.max(0,DUR-(performance.now()-t0));
    let pts=0; if(ok){tr.combo++;pts=Math.round(50+left/50)*(tr.combo>2?2:1);tr.score+=pts;vib([10,30,10])}else{tr.combo=0;vib(40)}
    tr.log.push({n:it.n,ok});
    document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.o===it.n)b.classList.add("right");else if(b.dataset.o===o)b.classList.add("wrong")});
    const s=it.jz?jzStatus(it.jz):"zu", badge=s==="zu"?`<span class="badge zu">✗ heute nicht frei</span>`:`<span class="badge frei">${BRUCH("var(--richtig)",13)} heute frei${s==="ganz"?" (ganzjährig)":""}</span>`;
    $("#tf").innerHTML=`<div style="display:grid;gap:10px"><div class="row" style="justify-content:space-between"><span class="h2 ${ok?"ok":"no"}">${ok?"Sauber angesprochen: "+it.n+" · +"+pts:o?"Gefehlt, das war: "+it.n:"Verhofft zu lange: "+it.n}</span>${badge}</div>
      <p class="muted" style="margin:0">${it.tip}. Elterntierschutz gilt immer.</p><button class="btn full" id="tn">${tr.i+1<tr.pool.length?"Nächstes Bild":"Auswertung"}</button></div>`;
    $("#tn").addEventListener("click",()=>{tr.i++;trRound()});markDay();}
  on(".opt","click",e=>answer(e.currentTarget.dataset.o));
}

/* ================= WISSEN: Jagdzeiten-Rad + Nachschlagen ================= */
const WHEEL={
 "Schalenwild":["Rehbock","Schmalreh","Rehgeiß und Kitz","Rotwild Schmalspießer/Schmaltier","Rotwild Hirsch/Alttier/Kalb","Dam-/Sikawild Hirsch/Alttier/Kalb","Gamswild","Muffelwild","Schwarzwild"],
 "Haar- und Raubwild":["Feldhase","Wildkaninchen","Fuchs","Dachs (adult)","Steinmarder (adult)","Baummarder","Iltis, Hermelin, Mauswiesel","Waschbär, Marderhund, Mink, Nutria"],
 "Federwild":["Fasan","Rebhuhn","Ringel- und Türkentaube","Stockente","Übrige Enten (Krick-, Pfeif-, Reiherente …)","Grau- und Kanadagans","Waldschnepfe","Rabenkrähe, Elster, Eichelhäher","Blässhuhn"]};
let wCat="Schalenwild", wSel=null;
const doy=s=>{const[m,d]=s.split("-").map(Number);const ref=new Date(2026,3,1),x=new Date(m>=4?2026:2027,m-1,d);return Math.round((x-ref)/864e5)};
function wheelSVG(){
  const names=WHEEL[wCat], R0=150, R1=58, step=(R0-R1)/names.length, cx=0, cy=0, now=new Date();
  const ang=dd=>dd/365*2*Math.PI-Math.PI/2;
  const pt=(r,a)=>[(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];
  const arc=(r,a0,a1)=>{const[x0,y0]=pt(r,a0),[x1,y1]=pt(r,a1),large=(a1-a0)%(2*Math.PI)>Math.PI?1:0;return `M${x0} ${y0} A${r} ${r} 0 ${large} 1 ${x1} ${y1}`};
  const M=["Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez","Jan","Feb","Mär"], mStart=["04-01","05-01","06-01","07-01","08-01","09-01","10-01","11-01","12-01","01-01","02-01","03-01"];
  let s="";
  mStart.forEach((ms,i)=>{const a=ang(doy(ms)),[x0,y0]=pt(R1-6,a),[x1,y1]=pt(R0+8,a);s+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--line)" stroke-width="1"/>`;
    const am=ang(doy(ms)+15),[tx,ty]=pt(R0+22,am);s+=`<text x="${tx}" y="${ty}" fill="var(--muted)" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle" dominant-baseline="middle">${M[i]}</text>`;});
  names.forEach((n,i)=>{const j=JZ.find(x=>x[0]===n); const r=R0-step*(i+.5), w=Math.max(4,step*.62), st=jzStatus(n,now);
    const col=st==="zu"?"var(--loden)":"var(--messing)", sel=wSel===n, op=wSel&&!sel?.3:1;
    s+=`<circle r="${r}" fill="none" stroke="var(--raised)" stroke-width="${w}"/>`;
    if(j[1]==="ganz")s+=`<circle class="arc" data-n="${esc(n)}" r="${r}" stroke="${col}" stroke-width="${sel?w+3:w}" opacity="${op}"/>`;
    else if(j[1]){const a0=ang(doy(j[1])),a1e=ang(doy(j[2])+1);let a1=a1e;if(a1<=a0)a1+=2*Math.PI;s+=`<path class="arc" data-n="${esc(n)}" d="${arc(r,a0,a1)}" stroke="${col}" stroke-width="${sel?w+3:w}" opacity="${op}"/>`;}});
  const td=Math.round((today()-new Date(today().getMonth()>=3?today().getFullYear():today().getFullYear()-1,3,1))/864e5), at=ang(td);
  const[nx,ny]=pt(R0+12,at),[ix,iy]=pt(R1-10,at);
  s+=`<line x1="${ix}" y1="${iy}" x2="${nx}" y2="${ny}" stroke="var(--signal)" stroke-width="2"/><circle cx="${nx}" cy="${ny}" r="4" fill="var(--signal)"/>`;
  const open=names.filter(n=>jzStatus(n,now)!=="zu").length;
  s+=`<text y="-6" text-anchor="middle" fill="var(--ink)" font-family="Alegreya, Georgia, serif" font-weight="700" font-size="34">${open}/${names.length}</text><text y="16" text-anchor="middle" fill="var(--muted)" font-family="IBM Plex Mono, monospace" font-size="11">HEUTE FREI</text>`;
  return `<svg viewBox="-190 -190 380 380" role="img" aria-label="Jagdzeiten-Rad ${wCat}: Jagdjahr April bis März, heute markiert">${s}</svg>`;
}
function wDetail(n){const j=JZ.find(x=>x[0]===n), st=jzStatus(n), f=s=>{const[m,d]=s.split("-");return d+"."+m+"."};
  if(j[1]==="ganz")return `<b>${n}</b>: ganzjährig. Elterntierschutz in der Setz- und Brutzeit beachten.`;
  if(!j[1])return `<b>${n}</b>: keine Jagdzeit.`;
  const t=today(); let k=0,d=new Date(t); while(k<366&&(inSeason(j[1],j[2],d)===(st==="frei"))){d.setDate(d.getDate()+1);k++}
  return `<b>${n}</b>: ${f(j[1])} bis ${f(j[2])}. ${st==="frei"?`<span class="ok">Frei, noch ${k} Tage.</span>`:`<span class="no">Geschont, öffnet in ${k} Tagen.</span>`}`;}
function vWissen(){
  $("#view").innerHTML=`<div class="screen"><h1 class="h">Wissen</h1>
   <section class="card wheel" style="gap:12px"><div class="row" style="justify-content:space-between"><span class="h2">Jagdzeiten-Rad</span><span class="eyebrow">Bayern ab 01.04.2026</span></div>
   <div class="chips">${Object.keys(WHEEL).map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===wCat}">${c}</button>`).join("")}</div>
   <div id="wsvg">${wheelSVG()}</div><p id="wd" style="margin:0;min-height:48px">${wSel?wDetail(wSel):`<span class="muted">Ring oder Eintrag antippen. Die rote Nadel zeigt heute.</span>`}</p>
   <div class="legend">${WHEEL[wCat].map(n=>{const st=jzStatus(n);return `<button class="lg" data-n="${esc(n)}" aria-pressed="${wSel===n}"><span class="dot" style="background:${st==="zu"?"var(--loden)":"var(--messing)"}"></span><span style="font-size:15px">${n}</span><span class="d">${st==="frei"?"frei":st==="ganz"?"ganzjährig":"geschont"}</span></button>`}).join("")}</div></section>
   <div id="refwrap"></div></div>`;
  $("#refwrap").appendChild($("#ref-src").content.cloneNode(true));
  on("[data-c]","click",e=>{wCat=e.currentTarget.dataset.c;wSel=null;vib(6);vWissen()});
  const pick=n=>{wSel=wSel===n?null:n;vib(6);$("#wsvg").innerHTML=wheelSVG();$("#wd").innerHTML=wSel?wDetail(wSel):`<span class="muted">Ring oder Eintrag antippen.</span>`;document.querySelectorAll(".lg").forEach(b=>b.setAttribute("aria-pressed",b.dataset.n===wSel));bindArcs()};
  const bindArcs=()=>document.querySelectorAll("#wsvg .arc").forEach(a=>a.addEventListener("click",()=>pick(a.dataset.n)));
  bindArcs(); on(".lg","click",e=>pick(e.currentTarget.dataset.n));
  on(".toc a","click",e=>{e.preventDefault();const t=document.getElementById(e.currentTarget.getAttribute("href").slice(1));if(t)t.scrollIntoView({behavior:"smooth"})});

function sgOf(c){const d=c[0],q=c[1]+" "+c[2];

  if(d==="Jagdzeiten")return 3;

  if(d==="Naturschutz, Land- und Waldbau")return 6;
  if(d==="Hunde & Revier")return /Hund|Brauchbarkeit/.test(q)?5:4;
  if(d==="Schuss & Nachsuche")return /Schweißhund/.test(q)?5:4;
  if(d==="Wildbret")return 4;
  if(d==="Wildbiologie"&&/Schälen|Äsungstyp/.test(q))return 6;

  queue=[...due,...fresh.slice(0,10)];

function backBar(title){return `<button class="back" id="back">← Lernen</button><h1 class="h" style="font-size:36px">${title}</h1>`}
function bindBack(){$("#back").addEventListener("click",()=>{lernView="menu";vLernen();window.scrollTo({top:0})})}
function lernKarten(){
  $("#view").innerHTML=`<div class="screen">${backBar(sgFilter?SG[sgFilter-1].s:"Karten")}${sgFilter?`<p class="muted" style="margin:0">Sachgebiet ${sgFilter}: ${SG[sgFilter-1].t}</p>`:""}<div id="lz"></div></div>`;bindBack();karten();}
function lernQuiz(){$("#view").innerHTML=`<div class="screen">${backBar("Revier-Quiz")}<div id="lz"></div></div>`;bindBack();quizStart();}
function karten(){
  if(!queue.length&&cIdx==null)buildQueue();
  if(cIdx==null&&queue.length){cIdx=queue.shift();flipped=false}
  const nxt=queue[0], c=cIdx!=null?CARDS[cIdx]:null, done=doneToday(), pool=CARDS.filter(x=>!sgFilter||sgOf(x)===sgFilter), known=CARDS.map((x,k)=>k).filter(k=>(!sgFilter||sgOf(CARDS[k])===sgFilter)&&ST.srs[k]&&ST.srs[k].box>=3).length;
  $("#lz").innerHTML=`<div style="display:grid;gap:14px">
   <div class="row" style="justify-content:space-between"><span class="data">${known} von ${pool.length} sitzen</span><span class="data">heute ${done}/10</span></div>
   ${c?`<div class="deck" id="deck">
     ${nxt!=null?`<div class="fc back"><div class="inner"><div class="face"><span class="eyebrow">${CARDS[nxt][0]}</span><span class="q">${CARDS[nxt][1]}</span><span></span></div></div></div>`:""}
     <div class="fc ${flipped?"flipped":""}" id="top"><span class="stamp yes" id="sy">Sitzt</span><span class="stamp no" id="sn">Gefehlt</span>
      <div class="inner"><div class="face"><span class="eyebrow">SG ${sgOf(c)} · ${c[0]}${ST.srs[cIdx]?" · Stufe "+ST.srs[cIdx].box:" · neu"}</span><span class="q">${c[1]}</span><span class="muted" style="font-size:14px">Tippen zum Umdrehen</span></div>
      <div class="face a"><span class="eyebrow" style="color:var(--loden-text)">Antwort</span><span class="ans">${c[2]}</span><span class="muted" style="font-size:14px">Rechts wischen: sitzt. Links: gefehlt, kommt morgen wieder.</span></div></div></div></div>
   <div class="actions"><button class="circ no" id="bn" aria-label="Gefehlt">✗</button><button class="btn ghost" id="bf">Umdrehen</button><button class="circ yes" id="by" aria-label="Sitzt">${BRUCH("var(--richtig)",24)}</button></div>`
   :`<section class="card" style="text-align:center"><span class="score">${BRUCH("var(--messing)",48)}</span><span class="h2 fr" style="font-size:30px">Für heute verbrochen</span><button class="btn" id="more">10 weitere Karten</button></section>`}</div>`;
  const m=$("#more"); if(m)m.addEventListener("click",()=>{queue=[];buildQueue();karten()});
  if(!c)return;
  const top=$("#top"), sy=$("#sy"), sn=$("#sn");
  const flip=()=>{flipped=!flipped;top.classList.toggle("flipped",flipped);vib(6)};
  $("#bf").addEventListener("click",flip); $("#by").addEventListener("click",()=>fling(true)); $("#bn").addEventListener("click",()=>fling(false));
  let x0=null,dx=0,moved=false;
  top.addEventListener("pointerdown",e=>{x0=e.clientX;dx=0;moved=false;top.setPointerCapture(e.pointerId);top.classList.add("dragging")});
  top.addEventListener("pointermove",e=>{if(x0==null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;top.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;sy.style.opacity=Math.max(0,dx/110);sn.style.opacity=Math.max(0,-dx/110)});
  const end=()=>{if(x0==null)return;top.classList.remove("dragging");x0=null;if(Math.abs(dx)>110){fling(dx>0)}else{top.style.transform="";sy.style.opacity=0;sn.style.opacity=0;if(!moved)flip()}};
  top.addEventListener("pointerup",end); top.addEventListener("pointercancel",end);
  function fling(ok){vib(ok?[10,30,10]:20);top.style.transition="transform .35s ease,opacity .35s";top.style.transform=`translateX(${ok?600:-600}px) rotate(${ok?25:-25}deg)`;top.style.opacity=0;(ok?sy:sn).style.opacity=1;setTimeout(()=>grade(ok),RM?0:260)}
}

/* ---------- Prüfung: schriftlich ---------- */
let ex=null;
function mcFrom(k){const c=CARDS[k], same=CARDS.map((x,i)=>i).filter(i=>i!==k&&CARDS[i][0]===c[0]&&CARDS[i][2]!==c[2]);
  const other=CARDS.map((x,i)=>i).filter(i=>i!==k&&sgOf(CARDS[i])===sgOf(c)&&CARDS[i][2]!==c[2]);
  const pick=[...new Set([...same.sort(()=>Math.random()-.5),...other.sort(()=>Math.random()-.5)])].slice(0,3).map(i=>CARDS[i][2]);
  const opts=[c[2],...pick].sort(()=>Math.random()-.5);return {k,q:c[1],opts,a:opts.indexOf(c[2]),sg:sgOf(c)}}
function pSchriftlich(){
  if(!ex||ex.done===undefined){
    $("#view").innerHTML=`<div class="screen">${backBar("Schriftlich")}
     <p class="lede">In Bayern bekommst du 100 Fragen aus allen sechs Sachgebieten und hast 100 Minuten. Im Original kann eine Frage auch mehrere richtige Antworten haben, hier ist es immer genau eine.</p>
     <div class="register" style="border-top-width:1px">
      <button class="reg" data-n="20"><span class="num" style="font-size:30px">20</span><span class="txt"><span class="h2" style="font-size:19px">Kurzer Bogen</span><span class="muted">20 Fragen, 20 Minuten</span></span><span class="arr">→</span></button>
      <button class="reg" data-n="100"><span class="num" style="font-size:30px">100</span><span class="txt"><span class="h2" style="font-size:19px">Voller Bogen</span><span class="muted">100 Fragen, 100 Minuten, wie in der Prüfung</span></span><span class="arr">→</span></button></div>
     <p class="data">Keine amtlichen Prüfungsfragen. Die Fragen entstehen aus deinen Lernkarten.</p></div>`;
    bindBack();
    on("[data-n]","click",e=>{const n=+e.currentTarget.dataset.n;const per=Math.ceil(n/6);let ids=[];SG.forEach(g=>{ids.push(...CARDS.map((c,k)=>k).filter(k=>sgOf(CARDS[k])===g.n).sort(()=>Math.random()-.5).slice(0,per))});ids=ids.sort(()=>Math.random()-.5).slice(0,n);
      ex={qs:ids.map(mcFrom),i:0,ans:[],t0:Date.now(),dur:n*60000,done:false};exRender()});
    return;}
  exRender();
}
let exTimer=null;
function exRender(){
  clearInterval(exTimer);
  if(ex.done||ex.i>=ex.qs.length)return exEnd();
  const q=ex.qs[ex.i];
  $("#view").innerHTML=`<div class="screen"><div class="row" style="justify-content:space-between"><button class="back" id="xq">Abbrechen</button><span class="data" id="clk"></span></div>
   <div class="bar"><i style="width:${(ex.i/ex.qs.length*100).toFixed(1)}%"></i></div>
   <span class="data">Frage ${ex.i+1} von ${ex.qs.length} · Sachgebiet ${q.sg}</span><h2 class="qq">${q.q}</h2>
   <div class="qopts">${q.opts.map((t,k)=>`<button class="qopt" data-k="${k}"><span class="k">${"abcd"[k]})</span><span>${t}</span></button>`).join("")}</div></div>`;
  $("#xq").addEventListener("click",()=>{clearInterval(exTimer);ex=null;lernView="menu";vLernen()});
  const tick=()=>{const left=ex.dur-(Date.now()-ex.t0);if(left<=0){ex.done=true;exEnd();return}$("#clk").textContent=`${Math.floor(left/60000)}:${pad(Math.floor(left%60000/1000))} übrig`};tick();exTimer=setInterval(tick,1000);
  on(".qopt","click",e=>{ex.ans[ex.i]=+e.currentTarget.dataset.k;vib(6);ex.i++;exRender();window.scrollTo({top:0})});
}
function exEnd(){
  clearInterval(exTimer);ex.done=true;markDay();
  const per=SG.map(g=>{const qs=ex.qs.map((q,i)=>({q,i})).filter(x=>x.q.sg===g.n);const r=qs.filter(x=>ex.ans[x.i]===x.q.a).length;return {g,r,n:qs.length}});
  const r=per.reduce((s,x)=>s+x.r,0), n=ex.qs.length, pct=r/n;
  const wrong=ex.qs.map((q,i)=>({q,i})).filter(x=>ex.ans[x.i]!==x.q.a);
  $("#view").innerHTML=`<div class="screen">${backBar("Auswertung")}
   <div class="row" style="align-items:baseline;gap:14px"><span class="score">${r}/${n}</span><span class="h2 ${pct>=.8?"ok fr":"no"}" style="font-size:${pct>=.8?28:21}px">${pct>=.8?"Waidmannsheil":"Noch nicht prüfungsreif"}</span></div>
   <p class="muted" style="margin:0">Richtwert für die Übung: 80 %. Die genaue Bestehensregel steht in der JFPO, schau sie dir vor der Prüfung an.</p>
   <div class="register" style="border-top-width:1px">${per.map(x=>`<div class="reg" style="cursor:default"><span class="num" style="font-size:26px;color:${x.n&&x.r/x.n>=.8?"var(--richtig)":"var(--falsch)"}">${x.r}/${x.n}</span><span class="txt"><span class="h2" style="font-size:17px">${x.g.n}. ${x.g.t}</span><span class="bar"><i style="width:${x.n?(x.r/x.n*100).toFixed(0):0}%"></i></span></span><span></span></div>`).join("")}</div>
   ${wrong.length?`<h2 class="sec">Gefehlt (${wrong.length})</h2>${wrong.map(x=>`<div class="card"><span class="data">SG ${x.q.sg}</span><span class="h2" style="font-size:18px">${x.q.q}</span><p style="margin:0" class="ok">${x.q.opts[x.q.a]}</p></div>`).join("")}`:""}
   <button class="btn full" id="again">Neuer Bogen</button></div>`;
  bindBack(); $("#again").addEventListener("click",()=>{ex=null;pSchriftlich()});
  wrong.forEach(x=>{ST.srs[x.q.k]={box:1,due:isoD(today())}});save();
}

const DIRS=["N","NO","O","SO","S","SW","W","NW"];
const dIdx=d=>DIRS.indexOf(d);
function sitzScore(s,wind,zeit){ // wind = woher er kommt
  let pts=0, why=[];
  const diff=Math.min((dIdx(wind)-dIdx(s.wild)+8)%8,(dIdx(s.wild)-dIdx(wind)+8)%8); // 0 = Wind kommt vom Wild
  if(wind==="still"){pts+=1;why.push("Kaum Wind, die Thermik entscheidet.")}
  else if(diff===0){pts+=3;why.push(`Wind aus ${wind} kommt genau von dort, wo das Wild herkommt. Deine Witterung zieht weg.`)}
  else if(diff===1){pts+=2;why.push(`Wind aus ${wind} kommt leicht seitlich vom Wild. Geht.`)}
  else if(diff===2){pts+=0;why.push(`Seitenwind aus ${wind}. Riskant, das Wild kann dich winden.`)}
  else if(diff===3){pts-=2;why.push(`Wind aus ${wind} trägt deine Witterung schräg Richtung Wild. Eher nicht.`)}
  else {pts-=3;why.push(`Wind aus ${wind} trägt deine Witterung genau zum Wild. Heute nicht.`)}
  if(s.lage==="fuss"){if(zeit==="abend"){pts+=1;why.push("Abends fällt die Thermik hangabwärts, weg vom Wild über dir.")}else{pts-=1;why.push("Morgens steigt die Thermik hangaufwärts, zum Wild über dir.")}}
  if(s.lage==="oben"){if(zeit==="morgen"){pts+=1;why.push("Morgens steigt die Thermik zu dir hoch, weg vom Wild unter dir.")}else{pts-=1;why.push("Abends fällt die Thermik hangabwärts, zum Wild unter dir.")}}
  return {pts,why};
}

function reife(n){
  const ids=CARDS.map((c,k)=>k).filter(k=>sgOf(CARDS[k])===n), f=FE();let s=0;
  ids.forEach(k=>{const r=ST.srs[k];if(!r)return;s+=r.box>=4?1:r.box===3?.85:r.box===2?.5:.15;if(f[k])s-=.1});
  const c=ids.length?Math.max(0,s)/ids.length:0;
  const ex=(ST.exams||[]).slice(-3).map(e=>e.per&&e.per[n]).filter(x=>x&&x[1]);let e=null;
  if(ex.length){e=ex.reduce((a,x)=>a+x[0],0)/ex.reduce((a,x)=>a+x[1],0)}
  const p=e==null?c:c*.6+e*.4;
  const gaps=ids.filter(k=>!ST.srs[k]||ST.srs[k].box<3).sort((a,b)=>((f[b]||{}).n||0)-((f[a]||{}).n||0)||((ST.srs[b]?1:0)-(ST.srs[a]?1:0)));
  return {p,c,e,gaps,n:ids.length};
}

/* ---------- Jahresstrecke ---------- */
function jagdjahr(d=new Date()){const y=d.getMonth()<3?d.getFullYear()-1:d.getFullYear();return {y,von:new Date(y,3,1),bis:new Date(y+1,2,31,23,59)}}
function dauer(z){const m=(z||"").match(/(\d{1,2})[:.](\d{2})\D+(\d{1,2})[:.](\d{2})/);if(!m)return 0;let a=+m[1]*60+ +m[2],b=+m[3]*60+ +m[4];if(b<a)b+=1440;return (b-a)/60}
tagebuch=(function(orig){return function(){orig();
  const jj=jagdjahr(), L=(ST.journal||[]).filter(e=>{const d=new Date(e.date+"T12:00");return d>=jj.von&&d<=jj.bis});
  const h=L.reduce((a,e)=>a+dauer(e.zeit),0), an=L.filter(e=>e.anblick&&e.anblick.trim()).length, str=L.filter(e=>e.strecke&&e.strecke.trim());
  const mon=Array(12).fill(0);L.forEach(e=>{const m=new Date(e.date+"T12:00").getMonth();mon[(m+9)%12]++});const mx=Math.max(1,...mon);
  const ML=["A","M","J","J","A","S","O","N","D","J","F","M"];
  const by={};str.forEach(e=>{const k=e.strecke.trim();by[k]=(by[k]||0)+1});
  $("#rz").insertAdjacentHTML("afterbegin",`<section class="card strecke" style="gap:12px"><div class="row" style="justify-content:space-between"><span class="h2">Jagdjahr ${jj.y}/${String(jj.y+1).slice(2)}</span><span class="eyebrow">1. April bis 31. März</span></div>
   <div class="stats"><div><span class="score" style="font-size:34px">${L.length}</span><span class="data">Ansitze</span></div><div><span class="score" style="font-size:34px">${h?Math.round(h):"–"}</span><span class="data">Stunden</span></div><div><span class="score" style="font-size:34px">${L.length?Math.round(an/L.length*100)+"%":"–"}</span><span class="data">mit Anblick</span></div><div><span class="score" style="font-size:34px">${str.length}</span><span class="data">Strecke</span></div></div>
   <svg viewBox="0 0 240 64" class="mbars" aria-label="Ansitze pro Monat">${mon.map((v,i)=>`<rect x="${i*20+4}" y="${50-v/mx*44}" width="12" height="${Math.max(1,v/mx*44)}" rx="2" fill="${v?"var(--messing)":"var(--line)"}"/><text x="${i*20+10}" y="62" text-anchor="middle">${ML[i]}</text>`).join("")}</svg>
   ${str.length?`<div class="chips">${Object.entries(by).map(([k,v])=>`<span class="chip" style="cursor:default">${BRUCH("var(--messing)",13)} ${esc(k)}${v>1?" × "+v:""}</span>`).join("")}</div>`:`<p class="muted" style="margin:0">Noch keine Strecke in diesem Jagdjahr. Waidmannsheil für den nächsten Ansitz.</p>`}</section>`);
}})(tagebuch);

/* ---------- Lernkarten als Multiple Choice ---------- */
const MCC={}; let mcPick=null;
const mcWords=t=>new Set(String(t).toLowerCase().replace(/<[^>]+>/g," ").match(/[a-zäöüß0-9]{4,}/g)||[]);
const mcShape=t=>[/\d{1,2}\.\s?\d{1,2}\./.test(t),/§/.test(t),/\d/.test(t),/^(ja|nein)\b/i.test(t)];
mcFrom=function(k){const c=CARDS[k],a=c[2],la=a.length,wa=mcWords(a),sa=mcShape(a),sg=sgOf(c);
  const cand=CARDS.map((x,i)=>i).filter(i=>i!==k&&CARDS[i][2]!==a&&(CARDS[i][0]===c[0]||sgOf(CARDS[i])===sg));
  const sc=cand.map(i=>{const b=CARDS[i][2],lb=b.length,wb=mcWords(b),sb=mcShape(b);let ov=0;wb.forEach(w=>{if(wa.has(w))ov++});
    let v=-Math.abs(Math.log(lb/la))*1.6+ov/Math.max(3,wa.size)*2.5+sa.reduce((s,x,j)=>s+(x===sb[j]?.35:-.35),0)+(CARDS[i][0]===c[0]?.4:0)+Math.random()*.35;return {i,v}}).sort((x,y)=>y.v-x.v);
  const tooClose=t=>{const wb=mcWords(t);let ov=0;wb.forEach(w=>{if(wa.has(w))ov++});return ov/Math.max(1,Math.min(wa.size,wb.size))>.45||t.slice(0,24)===a.slice(0,24)};
  const pick=[];for(const x of sc){const t=CARDS[x.i][2];if(!pick.includes(t)&&!tooClose(t))pick.push(t);if(pick.length>=3)break}
  const opts=[a,...pick].sort(()=>Math.random()-.5);return {k,q:c[1],opts,a:opts.indexOf(a),sg}};
karten=(function(prev){return function(){
  if((ST.kmode||"mc")!=="mc")return kmodeBar(prev);
  if(!queue.length&&cIdx==null)buildQueue();
  if(cIdx==null&&queue.length){cIdx=queue.shift();mcPick=null}
  if(cIdx==null)return kmodeBar(prev);
  const c=CARDS[cIdx], q=MCC[cIdx]||(MCC[cIdx]=mcFrom(cIdx)), known=Object.values(ST.srs).filter(s=>s.box>=3).length, L="ABCD";
  $("#lz").innerHTML=`<div style="display:grid;gap:14px">${kmodeHTML()}
   <div class="row" style="justify-content:space-between"><span class="data">${known} von ${CARDS.length} sitzen</span><span class="data">heute ${doneToday()}/10${queue.length?` · noch ${queue.length+1}`:""}</span></div>
   <section class="card mcq" style="gap:14px"><span class="eyebrow">SG ${sgOf(c)} · ${c[0]}${ST.srs[cIdx]?" · Stufe "+ST.srs[cIdx].box:" · neu"}${FE()[cIdx]?` · <span style="color:var(--falsch)">Fehlerheft</span>`:""}</span>
    <span class="h2 mcqq">${c[1]}</span>
    <div class="mcopts">${q.opts.map((o,i)=>`<button class="mco" data-i="${i}"><span class="mcl">${L[i]}</span><span>${o}</span></button>`).join("")}</div>
    <div id="mcfb"></div></section></div>`;
  bindKmode(prev);
  const pick=i=>{if(mcPick!=null)return;mcPick=i;const ok=i===q.a;vib(ok?[10,30,10]:40);
    document.querySelectorAll(".mco").forEach(b=>{const j=+b.dataset.i;b.disabled=true;if(j===q.a)b.classList.add("right");else if(j===i)b.classList.add("wrong")});
    $("#mcfb").innerHTML=`<div class="glas-in"><span class="h2 ${ok?"ok fr":"no"}" style="font-size:${ok?24:20}px">${ok?BRUCH("var(--richtig)",18)+" Sitzt":"Gefehlt, kommt ins Fehlerheft"}</span>${ok?"":`<p style="margin:0">Richtig ist: <b>${c[2]}</b></p>`}</div>
     <button class="btn full" id="mcnext">Weiter</button>`;
    const nx=$("#mcnext");nx.focus({preventScroll:true});nx.onclick=()=>{delete MCC[cIdx];mcPick=null;grade(ok)}};
  on(".mco","click",e=>pick(+e.currentTarget.dataset.i));
}})(karten);
function kmodeHTML(){const m=ST.kmode||"mc";return `<div class="seg kseg"><button data-km="mc" aria-pressed="${m==="mc"}">Auswahl</button><button data-km="frei" aria-pressed="${m==="frei"}">Karteikarte</button></div>`}
